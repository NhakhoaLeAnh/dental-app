// 2. TẢI BỆNH NHÂN (ĐÃ FIX URL REST API)
async function loadPatients(search = "") {
  const listEl = document.getElementById("patientList");
  if (!listEl) return;
  listEl.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">Đang tải danh sách...</div>`;
  
  try {
    let patients = null;
    if (supabaseClient) {
      let query = supabaseClient.from('patients').select('*').order('created_at', { ascending: false });
      if (search && search.trim()) query = query.or(`full_name.ilike.%${search.trim()}%`);
      const { data } = await query;
      if (data) patients = data;
    }
    if (!patients) {
      let url = `${SUPABASE_URL}/rest/v1/patients?select=*&order=created_at.desc`;
      if (search && search.trim()) url += `&or=(full_name.ilike.*${encodeURIComponent(search.trim())}*)`;
      const res = await fetch(url, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
      if (res.ok) patients = await res.json();
    }

    if (!patients || patients.length === 0) {
      listEl.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">Chưa có bệnh nhân nào.</div>`;
      return;
    }

    listEl.innerHTML = patients.map(p => `
      <div onclick="selectPatient('${p.id}')"
           class="p-3 hover:bg-teal-50 cursor-pointer transition-colors ${String(currentPatient?.id) === String(p.id) ? 'bg-teal-50 border-l-4 border-teal-600' : ''}">
        <div class="font-semibold text-slate-800 text-xs sm:text-sm uppercase">${p.full_name}</div>
        <div class="text-[11px] text-slate-500">${p.phone || 'Chưa có SĐT'}</div>
        ${p.notes ? `<div class="text-[10px] text-amber-700 font-semibold mt-0.5 truncate">📌 Lưu ý: \${p.notes}</div>` : ''}
      </div>
    `).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="p-4 text-center text-rose-500 text-xs">⚠️ Lỗi kết nối: ${err.message}</div>`;
  }
}

document.getElementById("patientForm")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnSavePatient");
  btn.disabled = true; btn.innerText = "Đang lưu...";

  const payload = {
    full_name: document.getElementById("fullName").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    dob: document.getElementById("dob").value || null,
    gender: document.getElementById("gender").value,
    address: document.getElementById("address").value.trim() || null,
    medical_history: document.getElementById("medicalHistory").value.trim() || null,
    notes: document.getElementById("patientNotes").value.trim() || null
  };

  try {
    let inserted = null;
    if (supabaseClient) {
      const { data } = await supabaseClient.from('patients').insert([payload]).select();
      if (data && data) inserted = data;
    }
    if (!inserted) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/patients`, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data) inserted = data;
      }
    }
    document.getElementById("patientForm").reset();
    await loadPatients();
    if (inserted) selectPatient(inserted.id);
  } catch (err) {
    alert("Lỗi lưu: " + err.message);
  } finally {
    btn.disabled = false; btn.innerText = "+ Tiếp Nhận Bệnh Nhân";
  }
});

// 4. CHỌN BỆNH NHÂN (ĐÃ FIX CHUỖI NỘI SUY)
async function selectPatient(id) {
  let patient = null;
  if (supabaseClient) {
    const { data } = await supabaseClient.from('patients').select('*').eq('id', id).single();
    if (data) patient = data;
  }
  if (!patient) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/patients?id=eq.${id}&select=*`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    const list = await res.json();
    if (list && list) patient = list;
  }

  if (!patient) return;
  currentPatient = patient;

  document.getElementById("activePatientBanner").innerHTML = `
    <span>Đang khám: <strong class="text-teal-800 uppercase">${patient.full_name}</strong> (${patient.phone || 'Chưa SĐT'})</span>
  `;

  const noteBanner = document.getElementById("activePatientNotesBanner");
  const noteText = document.getElementById("bannerNotesText");
  if (patient.notes) {
    noteText.innerText = patient.notes;
    noteBanner.classList.remove("hidden");
  } else {
    noteBanner.classList.add("hidden");
  }

  if(document.getElementById("laboPatientName")) document.getElementById("laboPatientName").value = patient.full_name;
  if(document.getElementById("laboPatientId")) document.getElementById("laboPatientId").value = patient.id;

  loadPatients(document.getElementById("searchInput")?.value || "");
  await loadDentalChart(patient.id);
  await loadPatientPrescriptions(patient.id);
  await loadPatientPayments(patient.id);
}

// 5. TẢI & LƯU SƠ ĐỒ RĂNG
async function loadDentalChart(patientId) {
  document.querySelectorAll('.tooth-box').forEach(el => {
    el.className = "tooth-box w-8 h-10 sm:w-10 sm:h-12 border-2 border-slate-200 rounded-lg flex flex-col items-center justify-center bg-white text-slate-700 font-semibold text-xs shadow-xs";
  });

  let chartData = [];
  try {
    if (supabaseClient) {
      const { data } = await supabaseClient.from('dental_chart').select('*').eq('patient_id', String(patientId));
      if (data) chartData = data;
    } else {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/dental_chart?patient_id=eq.${patientId}&select=*`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) chartData = await res.json();
    }
  } catch(e){}

  currentTeethData = {};
  const planBody = document.getElementById("treatmentPlanBody");

  if (!chartData || chartData.length === 0) {
    if (planBody) planBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400 text-xs">Tất cả răng bình thường hoặc chưa lập kế hoạch.</td></tr>`;
    return;
  }

  let planRows = "";
  chartData.forEach(item => {
    currentTeethData[item.tooth_number] = item;
    const toothEl = document.getElementById(`tooth-${item.tooth_number}`);
    if (toothEl) {
      const cond = item.condition || '';
      if (item.status === 'Đã hoàn thành') toothEl.classList.add('tooth-done');
      else if (cond.includes('Implant')) toothEl.classList.add('tooth-implant');
      else if (cond.includes('Sâu') || cond.includes('tủy')) toothEl.classList.add('tooth-decay');
      else if (cond.includes('Mất răng')) toothEl.classList.add('tooth-missing');
      else if (cond.includes('Mão') || cond.includes('Cầu')) toothEl.classList.add('tooth-crown');
      else toothEl.classList.add('bg-slate-100');
    }

    planRows += `
      <tr class="hover:bg-slate-50">
        <td class="py-2.5 px-3 font-bold text-teal-700">Răng ${item.tooth_number}</td>
        <td class="py-2.5 px-3">${item.condition || '—'}</td>
        <td class="py-2.5 px-3 font-medium text-slate-800">${item.treatment_plan || '—'}</td>
        <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100">${item.status || 'Chưa làm'}</span></td>
        <td class="py-2.5 px-3 text-right"><button type="button" onclick="openToothModal(${item.tooth_number})" class="text-teal-600 hover:underline font-medium">Sửa</button></td>
      </tr>
    `;
  });

  if (planBody) planBody.innerHTML = planRows;
}

function openToothModal(toothNum) {
  if (!currentPatient) {
    alert("Vui lòng nhấp chọn một bệnh nhân ở danh sách bên trái trước!");
    return;
  }
  activeToothNum = toothNum;
  document.getElementById("modalToothNumber").innerText = toothNum;
  const exist = currentTeethData[toothNum] || {};
  document.getElementById("modalCondition").value = exist.condition || "Bình thường";
  document.getElementById("modalPlan").value = exist.treatment_plan || "";
  document.getElementById("modalStatus").value = exist.status || "Chưa làm";
  document.getElementById("toothModal").classList.remove("hidden");
}

function closeToothModal() {
  document.getElementById("toothModal").classList.add("hidden");
}

async function saveToothData() {
  if (!currentPatient || !activeToothNum) return;
  const condition = document.getElementById("modalCondition").value;
  const plan = document.getElementById("modalPlan").value.trim();
  const status = document.getElementById("modalStatus").value;

  try {
    if (supabaseClient) {
      await supabaseClient.from('dental_chart').delete().match({ patient_id: String(currentPatient.id), tooth_number: activeToothNum });
      if (condition !== "Bình thường" || plan) {
        await supabaseClient.from('dental_chart').insert([{
          patient_id: String(currentPatient.id), tooth_number: activeToothNum, condition, treatment_plan: plan, status
        }]);
      }
    } else {
      await fetch(`${SUPABASE_URL}/rest/v1/dental_chart?patient_id=eq.${currentPatient.id}&tooth_number=eq.${activeToothNum}`, {
        method: "DELETE", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (condition !== "Bình thường" || plan) {
        await fetch(`${SUPABASE_URL}/rest/v1/dental_chart`, {
          method: "POST",
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ patient_id: String(currentPatient.id), tooth_number: activeToothNum, condition, treatment_plan: plan, status })
        });
      }
    }
  } catch(e){}

  closeToothModal();
  await loadDentalChart(currentPatient.id);
}

async function loadLaboOrders() {
  const filter = document.getElementById("laboFilterStatus")?.value || "all";
  const tbody = document.getElementById("laboTableBody");
  if (!tbody) return;

  let orders = [];
  try {
    if (supabaseClient) {
      let query = supabaseClient.from('labo_orders').select('*').order('due_date', { ascending: true });
      if (filter !== "all") query = query.eq('status', filter);
      const { data } = await query;
      if (data) orders = data;
    } else {
      let url = `${SUPABASE_URL}/rest/v1/labo_orders?select=*&order=due_date.asc`;
      if (filter !== "all") url += `&status=eq.${encodeURIComponent(filter)}`;
      const res = await fetch(url, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
      if (res.ok) orders = await res.json();
    }
  } catch(e){}

  const allOrders = orders;
  const totalCount = allOrders.length;
  const pendingCount = allOrders.filter(o => o.status === 'Đang chế tác').length;
  const receivedCount = allOrders.filter(o => o.status === 'Đã về phòng khám').length;
  const totalCost = allOrders.reduce((sum, o) => sum + (Number(o.cost_price) || 0), 0);

  if(document.getElementById("laboKpiTotal")) document.getElementById("laboKpiTotal").innerText = totalCount;
  if(document.getElementById("laboKpiPending")) document.getElementById("laboKpiPending").innerText = pendingCount;
  if(document.getElementById("laboKpiReceived")) document.getElementById("laboKpiReceived").innerText = receivedCount;
  if(document.getElementById("laboKpiCost")) document.getElementById("laboKpiCost").innerText = totalCost.toLocaleString('vi-VN') + " đ";

  const badge = document.getElementById("laboBadgeCount");
  if (badge) {
    if (pendingCount > 0) {
      badge.innerText = pendingCount;
      badge.classList.remove('hidden');
    } else badge.classList.add('hidden');
  }

  if (orders.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">Chưa có đơn Labo nào trong danh mục này.</td></tr>`;
    return;
  }

  const todayStr = new Date().toISOString().split('T');
  tbody.innerHTML = orders.map(o => {
    const isDueToday = (o.due_date === todayStr && o.status === 'Đang chế tác');
    const isOverdue = (o.due_date < todayStr && o.status === 'Đang chế tác');
    let statusBadge = "bg-amber-100 text-amber-800";
    if (o.status === 'Đã về phòng khám') statusBadge = "bg-emerald-100 text-emerald-800";
    else if (o.status === 'Đã gắn hoàn tất') statusBadge = "bg-slate-100 text-slate-700";
    else if (o.status === 'Gửi sửa lại') statusBadge = "bg-rose-100 text-rose-800";

    return `
      <tr class="hover:bg-slate-50 ${isOverdue ? 'bg-rose-50/60' : ''}">
        <td class="py-2.5 px-3">
          <span class="font-bold">${o.due_date}</span>
          ${isDueToday ? '<span class="block text-[9px] font-bold text-amber-600 uppercase">Hôm nay lấy</span>' : ''}
          ${isOverdue ? '<span class="block text-[9px] font-bold text-rose-600 uppercase">Quá hạn</span>' : ''}
        </td>
        <td class="py-2.5 px-3">
          <div class="font-bold text-slate-900">${o.patient_name}</div>
          <div class="text-[11px] text-slate-500">${o.doctor_name}</div>
        </td>
        <td class="py-2.5 px-3">
          <div class="font-semibold text-slate-800">${o.item_type}</div>
          <div class="text-[11px] text-teal-700 font-bold">${o.teeth_number || ''} ${o.shade_color ? `(Màu \${o.shade_color})` : ''}</div>
        </td>
        <td class="py-2.5 px-3 text-slate-700 font-medium">${o.labo_name}</td>
        <td class="py-2.5 px-3">
          <select onchange="updateLaboStatus('${o.id}', this.value)" class="text-[10px] font-bold p-1 rounded border outline-none ${statusBadge}">
            <option value="Đang chế tác" ${o.status === 'Đang chế tác' ? 'selected' : ''}>⏳ Đang chế tác</option>
            <option value="Đã về phòng khám" ${o.status === 'Đã về phòng khám' ? 'selected' : ''}>✅ Đã về PK</option>
            <option value="Đã gắn hoàn tất" ${o.status === 'Đã gắn hoàn tất' ? 'selected' : ''}>🏁 Đã gắn xong</option>
            <option value="Gửi sửa lại" ${o.status === 'Gửi sửa lại' ? 'selected' : ''}>⚠ Gửi sửa lại</option>
          </select>
        </td>
        <td class="py-2.5 px-3 text-right">
          <button onclick="deleteLaboOrder('${o.id}')" class="text-rose-500 hover:underline text-xs">Xóa</button>
        </td>
      </tr>
    `;
  }).join('');
}

async function updateLaboStatus(id, newStatus) {
  try {
    if (supabaseClient) {
      await supabaseClient.from('labo_orders').update({ status: newStatus }).eq('id', id);
    } else {
      await fetch(`${SUPABASE_URL}/rest/v1/labo_orders?id=eq.${id}`, {
        method: "PATCH",
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ status: newStatus })
      });
    }
    loadLaboOrders();
  } catch(e) {
    alert("Lỗi cập nhật: " + e.message);
  }
}

async function deleteLaboOrder(id) {
  if (!confirm("Bạn có chắc muốn xóa đơn Labo này?")) return;
  try {
    if (supabaseClient) await supabaseClient.from('labo_orders').delete().eq('id', id);
    else {
      await fetch(`${SUPABASE_URL}/rest/v1/labo_orders?id=eq.${id}`, {
        method: "DELETE", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
    }
    loadLaboOrders();
  } catch(e){}
}

    patient_name: document.getElementById("crmPatientName").value.trim(),
    phone: document.getElementById("crmPatientPhone").value.trim(),
    task_type: document.getElementById("crmTaskType").value,
    due_date: document.getElementById("crmDueDate").value,
    assigned_to: document.getElementById("crmAssignedTo").value,
    content: document.getElementById("crmContent").value.trim()
  };
  try {
    if (supabaseClient) await supabaseClient.from('crm_tasks').insert([payload]);
    alert("Đã tạo lịch chăm sóc!");
    document.getElementById("crmTaskForm").reset();
    loadCrmTasks();
  } catch(err) { alert("Lỗi: " + err.message); }
});

// 8. ĐIỀU HƯỚNG TAB
function switchTab(tab) {
  const tabs = ['clinical', 'labo', 'pricing', 'inventory', 'schedule', 'crm', 'analytics', 'finance'];
  tabs.forEach(t => {
    const el = document.getElementById(t + 'Tab');
    if (el) el.classList.add('hidden');
    const btn = document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1));
    if (btn) btn.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all";
  });

  const activeEl = document.getElementById(tab + 'Tab');
  if (activeEl) activeEl.classList.remove('hidden');
  const activeBtn = document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (activeBtn) activeBtn.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold bg-white text-teal-800 shadow-sm transition-all";

  if (tab === 'labo') loadLaboOrders();
  else if (tab === 'pricing') loadServiceCatalog();
  else if (tab === 'inventory') loadInventoryItems();
  else if (tab === 'schedule') { loadAppointments(); loadStaffSchedules(); }
  else if (tab === 'crm') loadCrmTasks();
  else if (tab === 'finance') loadFinancialData();
}

async function exportPaymentsToCSV() {
  let payments = [];
  try {
    if (supabaseClient) {
      const { data } = await supabaseClient.from('payments').select('*');
      if (data) payments = data;
    } else {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?select=*`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
      if (res.ok) payments = await res.json();
    }
  } catch(e){}

  if (payments.length === 0) {
    alert("Chưa có giao dịch thu nào để xuất file!");
    return;
  }

  let csv = "\uFEFFNgày Thu,Bác Sĩ,Nội Dung,Số Tiền (VNĐ),Nguồn Khách\n";
  payments.forEach(p => {
    csv += `"${p.payment_date || ''}","${p.doctor_name || ''}","${p.service_name || ''}","${p.amount || 0}","${p.lead_source || ''}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `Bao_Cao_Nha_Khoa_Le_Anh_${new Date().toISOString().split('T')}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
